name: API tests

on:
  push:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Gate: everything except the tests that expose known defects in the demo API.
      - name: Core suite (must pass)
        run: npx playwright test --grep-invert @api-bug

      # These fail on purpose because the demo API is wrong (see RESULTS.md).
      # They still run and are reported, but do not turn the build red.
      - name: Known API defects (expected to fail)
        continue-on-error: true
        run: npx playwright test --grep @api-bug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
